spring.datasource.url=jdbc:h2:mem:auth;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
eureka.client.enabled=false
jwt.secret=test-secret-with-at-least-thirty-two-bytes-long
jwt.expiration=3600000
auth.bootstrap.admin-username=
auth.bootstrap.admin-password=
